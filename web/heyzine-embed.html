<!-- Plain HTML Heyzine embed (for anywhere that isn't the Next.js site).
     Replace XXXXXXXX with your flipbook ID from Heyzine. -->
<style>
  .fs-flipbook { position: relative; width: 100%; aspect-ratio: 2 / 1; max-height: 85vh; }
  .fs-flipbook iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  @media (max-width: 767px) { .fs-flipbook { aspect-ratio: 4 / 5; } }
</style>
<div class="fs-flipbook">
  <iframe
    src="https://heyzine.com/flip-book/XXXXXXXX.html"
    title="Food Stories Magazine"
    allow="fullscreen"
    allowfullscreen
    scrolling="no"
    loading="lazy">
  </iframe>
</div>
